name: Mevo
description: 'Mevo is a Brazilian healthtech company whose stated mission is to "descomplicar a
  saúde" (simplify healthcare) through a digital platform that connects doctors, patients, and
  pharmacies. Its products include Mevo Receita Digital (electronic/digital medical prescriptions
  replacing paper scripts), and Mevo Farma / Mevo Dispensação (online medication purchase,
  dispensing, and partner-pharmacy fulfillment with delivery). Mevo sells to hospitals, health
  operators, clinics, and telemedicine platforms as a B2B partner. No public developer API,
  OpenAPI, or documentation portal is currently published; this profile tracks the company in the
  API Evangelist network. Surfaced as a portfolio company of Matrix Partners and Prosus Ventures.'
